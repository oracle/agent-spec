<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting…</title>
  <meta http-equiv="refresh" content="0; url=26.3.1/">
  <link rel="canonical" href="26.3.1/">
</head>
<body>
    <p>Redirecting to the latest stable documentation…</p>

  <script>
    fetch("switcher.json")
      .then(response => response.json())
      .then(versions => {
        const stable = versions.find(v => v.version !== "dev");
        window.location.replace(stable ? stable.url : "26.3.1/");
      })
      .catch(() => {
        window.location.replace("26.3.1/");
      });
  </script>
</body>
</html>
